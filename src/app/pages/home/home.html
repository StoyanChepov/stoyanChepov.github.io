<section id="home" class="hero">
  <p class="greeting">Hello, I'm</p>

  <h1>{{ profile().name }}</h1>

  <h2 class="role">{{ profile().role }}</h2>

  <p class="description">
    {{ profile().description }}
  </p>

  <div class="hero-actions">
    <a class="button button-primary" routerLink="/" fragment="projects">
      View my projects →
    </a>

    <a class="button button-secondary" routerLink="/" fragment="contact">
      Get in touch
    </a>
  </div>
</section>

<app-projects id="projects" />

<app-contact id="contact" />
