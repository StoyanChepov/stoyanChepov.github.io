<article class="project-card" tabindex="0" (click)="selected.emit(project())"
  (keydown.enter)="selected.emit(project())">
  <div class="card-header">
    <h3>
      {{ project().title }}
    </h3>

    @if (project().primaryLanguage) {
    <span class="primary-language">
      {{ project().primaryLanguage }}
    </span>
    }
  </div>

  <p class="description">
    {{ project().description }}
  </p>

  <div class="links">
    <a class="button button-primary" [routerLink]="[
        '/projects',
        project().id
      ]" (click)="$event.stopPropagation()" (keydown.enter)="$event.stopPropagation()">
      View project →
    </a>

    <a class="button button-secondary" [href]="project().githubUrl" target="_blank" rel="noopener noreferrer"
      (click)="$event.stopPropagation()" (keydown.enter)="$event.stopPropagation()">
      GitHub ↗
    </a>
  </div>
</article>
