<article class="project-card" tabindex="0" (click)="selected.emit(project())"
  (keydown.enter)="selected.emit(project())">
  <div class="content">
    <h3>
      {{ project().title }}
    </h3>

    <p class="description">
      {{ project().description }}
    </p>

    @if (project().primaryLanguage) {
    <span class="primary-language">
      {{ project().primaryLanguage }}
    </span>
    }

    <div class="project-meta">
      <span>
        ⭐ {{ project().stars }}
      </span>

      <span>
        🍴 {{ project().forks }}
      </span>
    </div>

    <div class="links">

      <a [href]="project().githubUrl" target="_blank" rel="noopener noreferrer" (click)="$event.stopPropagation()"
        (keydown.enter)="$event.stopPropagation()">
        GitHub ↗
      </a>

      <a class="details-link" [routerLink]="[
          '/projects',
          project().id
        ]" (click)="$event.stopPropagation()" (keydown.enter)="$event.stopPropagation()">
        View project →
      </a>

    </div>

  </div>
</article>
