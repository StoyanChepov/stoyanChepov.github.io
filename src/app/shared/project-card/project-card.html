<article class="project-card">
  <div class="content">
    <p class="project-id">
      {{ project().id }}
    </p>

    <h3>
      {{ project().title }}
    </h3>

    <p class="description">
      {{ project().description }}
    </p>

    <div class="technologies">
      @for (technology of project().technologies; track technology) {
        <span>{{ technology }}</span>
      }
    </div>

    <div class="links">
      <a
        [href]="project().githubUrl"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub ↗
      </a>

      @if (project().liveUrl) {
        <a
          [href]="project().liveUrl"
          target="_blank"
          rel="noopener noreferrer"
        >
          Live Demo ↗
        </a>
      }
    </div>
  </div>
</article>
