<header class="navbar">
  <a class="logo" routerLink="/">
    Stoyan<span>.</span>
  </a>

  <nav>
    <a routerLink="/">Home</a>
    <a routerLink="/about">About</a>
    <a routerLink="/projects">Projects</a>
    <a routerLink="/contact">Contact</a>
  </nav>

  <div class="actions">
    <button
      type="button"
      class="theme-toggle"
      (click)="themeService.toggle()"
    >
      @if (themeService.theme() === 'dark') {
        Light mode
      } @else {
        Dark mode
      }
    </button>

    <a
      class="github-link"
      href="https://github.com/StoyanChepov"
      target="_blank"
      rel="noopener noreferrer"
    >
      GitHub ↗
    </a>
  </div>
</header>
