<header class="navbar">
  <a class="logo" routerLink="/" fragment="home">
    Stoyan<span>.</span>
  </a>

  <nav>
    @for (section of sections; track section.id) {
    <a routerLink="/" [fragment]="section.id" [class.active]="activeSection() === section.id"
      [attr.aria-current]="activeSection() === section.id ? 'location' : null">
      {{ section.label }}
    </a>
    }
  </nav>

  <div class="actions">
    <button type="button" class="theme-toggle" (click)="themeService.toggle()" [attr.aria-label]="
    themeService.theme() === 'dark'
      ? 'Switch to light mode'
      : 'Switch to dark mode'
  " [attr.aria-pressed]="
    themeService.theme() === 'dark'
  ">
      <span class="theme-icon" aria-hidden="true">
        @if (themeService.theme() === 'dark') {
        ☾
        } @else {
        ☀
        }
      </span>

      <span class="theme-track" aria-hidden="true">
        <span class="theme-thumb"></span>
      </span>
    </button>

    <a class="github-link" href="https://github.com/StoyanChepov" target="_blank" rel="noopener noreferrer">
      GitHub ↗
    </a>
  </div>
</header>
